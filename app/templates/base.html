<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админка{% endblock %}</title>
    <!-- Подключение Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-light">

    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">Панель администратора</h1>
            <nav id="admin-navbar" class="d-flex gap-2" style="display: none;">
                <a href="/" class="btn btn-outline-light btn-sm">🏠 Главная</a>
                <a href="/tasks" class="btn btn-outline-light btn-sm">📌 Задачи</a>
                <a href="/users" class="btn btn-outline-light btn-sm">👤 Пользователи</a>
                <a href="#" id="logout-button" onclick="logout()" class="btn btn-danger btn-sm">🚪 Выйти</a>
            </nav>
            
        </div>
    </header>
<!-- Подключение Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/main.js"></script>
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    
</body>
</html>
