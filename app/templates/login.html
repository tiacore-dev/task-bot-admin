{% extends "base.html" %}

{% block title %}Вход в админку{% endblock %}

{% block content %}
<h2>Вход в админку</h2>
<form id="login-form">
    <label>Логин:</label>
    <input type="text" name="username" required>
    <label>Пароль:</label>
    <input type="password" name="password" required>
    <button type="submit">Войти</button>
</form>
<script src="/static/auth.js"></script>
{% endblock %}
